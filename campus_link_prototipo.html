<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Campus Link — Protótipo navegável</title>
<style>
  :root {
    --navy:#14243c; --navy-2:#1c3454; --blue:#4263eb; --blue-dark:#3152d8;
    --sky:#eaf0ff; --mint:#dff8ee; --green:#14855f; --gold:#e5a128;
    --ink:#1b2940; --muted:#738097; --line:#e7ebf2; --canvas:#f5f7fb; --white:#fff;
    --radius:18px; --shadow:0 12px 34px rgba(24,42,75,.06);
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--canvas); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:14px; }
  button,input,select,textarea { font:inherit; }
  button { cursor:pointer; }
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible { outline:3px solid rgba(66,99,235,.25); outline-offset:2px; }
  .layout { display:grid; grid-template-columns:248px minmax(0,1fr); min-height:100vh; }
  .sidebar { background:var(--navy); color:#d8e1ef; padding:26px 16px 18px; display:flex; flex-direction:column; min-height:100vh; }
  .brand { display:flex; align-items:center; gap:11px; padding:0 10px 31px; color:white; }
  .brand-mark { width:38px; height:38px; display:grid; place-items:center; border-radius:12px; color:white; background:linear-gradient(135deg,#6b8cff,#3f5dd8); font-size:18px; font-weight:850; box-shadow:0 5px 14px #101b324d; }
  .brand-name { font-size:17px; font-weight:800; letter-spacing:-.5px; }
  .brand-name span { color:#8fe3c1; }
  .brand-sub { color:#93a6c1; font-size:10px; margin-top:3px; letter-spacing:.8px; text-transform:uppercase; }
  .nav-label { padding:0 12px 10px; color:#8194af; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:1.5px; }
  .nav { display:grid; gap:5px; }
  .nav-btn { display:flex; align-items:center; gap:12px; width:100%; border:0; padding:12px 13px; text-align:left; background:transparent; color:#b9c6da; border-radius:11px; font-size:13px; font-weight:600; transition:.18s; }
  .nav-btn:hover { background:#ffffff0c; color:#fff; }
  .nav-btn.active { color:#fff; background:#ffffff16; box-shadow:inset 3px 0 #8fe3c1; }
  .nav-icon { width:19px; text-align:center; font-size:17px; opacity:.95; }
  .sidebar-bottom { margin-top:auto; }
  .help-box { margin:24px 5px 19px; background:#203957; border:1px solid #36506c; border-radius:14px; padding:15px; }
  .help-box strong { display:block; font-size:12px; color:white; margin-bottom:5px; }
  .help-box p { font-size:11px; color:#adbed4; line-height:1.55; margin:0 0 12px; }
  .help-box button { background:#ffffff12; border:1px solid #55708c; border-radius:8px; padding:8px 10px; color:white; font-size:11px; font-weight:700; }
  .user-mini { display:flex; gap:10px; align-items:center; padding:15px 9px 3px; border-top:1px solid #ffffff17; }
  .avatar { display:grid; place-items:center; flex-shrink:0; width:38px; height:38px; border-radius:50%; color:#294179; background:#dce6ff; font-weight:800; }
  .avatar.green { background:#d7f5e8; color:#167454; }
  .avatar.orange { background:#ffead0; color:#985a11; }
  .user-mini strong { color:white; font-size:12px; display:block; }
  .user-mini small { color:#91a4bd; font-size:10px; display:block; margin-top:3px; }
  .main { min-width:0; }
  .topbar { height:83px; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0 36px; border-bottom:1px solid var(--line); background:#ffffffd9; backdrop-filter:blur(12px); position:sticky; top:0; z-index:5; }
  .crumb { color:#8b96a9; font-size:11px; margin-bottom:5px; }
  .page-heading { margin:0; font-size:20px; letter-spacing:-.6px; color:var(--ink); }
  .topbar-right { display:flex; align-items:center; gap:15px; }
  .role-switch { display:flex; align-items:center; gap:3px; padding:4px; border:1px solid var(--line); background:#f5f7fc; border-radius:11px; }
  .role-switch button { border:0; background:transparent; color:#718098; font-size:11px; font-weight:750; padding:9px 12px; border-radius:8px; white-space:nowrap; }
  .role-switch button.active { background:white; color:var(--blue); box-shadow:0 2px 7px #23395b12; }
  .notification { width:38px; height:38px; border:1px solid var(--line); background:white; border-radius:11px; display:grid; place-items:center; color:#65728a; font-size:17px; position:relative; }
  .notification:after { content:""; width:6px; height:6px; background:#ef6a67; border:2px solid white; border-radius:50%; position:absolute; top:7px; right:8px; }
  .content { max-width:1500px; padding:29px 36px 45px; margin:0 auto; }
  .welcome-row { display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:23px; }
  .eyebrow { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:1.6px; color:var(--blue); margin-bottom:9px; }
  h2 { margin:0; font-size:25px; letter-spacing:-.8px; line-height:1.2; }
  .subtext { color:var(--muted); font-size:13px; line-height:1.6; margin:8px 0 0; }
  .btn { display:inline-flex; justify-content:center; align-items:center; gap:8px; border:1px solid transparent; padding:11px 15px; border-radius:10px; font-size:12px; font-weight:750; transition:.18s; text-decoration:none; }
  .btn-primary { background:var(--blue); color:#fff; box-shadow:0 5px 12px #4263eb25; }
  .btn-primary:hover { background:var(--blue-dark); transform:translateY(-1px); }
  .btn-secondary { background:white; border-color:var(--line); color:#43516a; }
  .btn-secondary:hover { border-color:#c6d1e8; background:#fafbff; }
  .btn-soft { background:var(--sky); color:var(--blue); }
  .btn-success { background:var(--mint); color:var(--green); }
  .btn-small { padding:8px 11px; font-size:11px; border-radius:8px; }
  .btn:disabled { opacity:.65; cursor:default; transform:none; }
  .hero { overflow:hidden; position:relative; display:grid; grid-template-columns:minmax(0,1.4fr) minmax(190px,.6fr); gap:20px; background:linear-gradient(115deg,#2949b9 0%,#4263eb 62%,#637bed 100%); border-radius:20px; padding:28px 31px; color:white; margin-bottom:22px; box-shadow:0 12px 26px #4263eb1d; }
  .hero:before,.hero:after { content:""; position:absolute; border:1px solid #ffffff22; border-radius:50%; pointer-events:none; }
  .hero:before { width:270px; height:270px; right:6%; top:-190px; }
  .hero:after { width:190px; height:190px; right:10%; bottom:-150px; }
  .hero-copy,.hero-progress { position:relative; z-index:1; }
  .hero-tag { display:inline-flex; align-items:center; gap:6px; font-size:10px; font-weight:750; letter-spacing:.4px; color:#e1e8ff; background:#ffffff1a; padding:7px 10px; border:1px solid #ffffff21; border-radius:20px; margin-bottom:14px; }
  .hero h2 { font-size:24px; color:#fff; max-width:480px; line-height:1.2; }
  .hero p { color:#dfe6ff; max-width:470px; font-size:12px; line-height:1.65; margin:11px 0 19px; }
  .hero .btn { background:#fff; color:#3152ca; }
  .hero .btn:hover { background:#eef2ff; }
  .hero-progress { align-self:center; justify-self:end; width:100%; max-width:210px; background:#ffffff14; border:1px solid #ffffff27; border-radius:16px; padding:19px; }
  .hero-progress .label { font-size:10px; color:#d9e2ff; margin-bottom:8px; }
  .progress-num { font-size:30px; font-weight:800; letter-spacing:-1px; margin-bottom:10px; }
  .progress-track { height:7px; background:#ffffff33; overflow:hidden; border-radius:10px; }
  .progress-track span { display:block; width:78%; height:100%; border-radius:10px; background:#8fe3c1; }
  .progress-foot { color:#dce5ff; font-size:10px; margin-top:10px; line-height:1.5; }
  .stats-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:26px; }
  .stat-card { padding:17px 18px; background:white; border:1px solid var(--line); border-radius:15px; box-shadow:0 4px 13px #21375a04; }
  .stat-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; }
  .stat-icon { display:grid; place-items:center; width:34px; height:34px; border-radius:10px; background:#edf1ff; color:var(--blue); font-size:16px; }
  .stat-icon.green { background:#e3f8ef; color:#17865f; }
  .stat-icon.gold { background:#fff3dd; color:#bb8018; }
  .stat-icon.pink { background:#ffeded; color:#d45e69; }
  .trend { color:#17865f; background:#e6f8ef; border-radius:6px; padding:4px 6px; font-size:9px; font-weight:800; }
  .stat-value { font-size:25px; font-weight:800; letter-spacing:-.7px; }
  .stat-label { color:var(--muted); font-size:11px; margin-top:5px; }
  .section-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 15px; }
  .section-head h3 { font-size:15px; letter-spacing:-.3px; margin:0; }
  .text-link { border:0; background:transparent; color:var(--blue); font-size:11px; font-weight:800; padding:5px; }
  .dashboard-grid { display:grid; grid-template-columns:minmax(0,1.55fr) minmax(250px,.85fr); gap:20px; align-items:start; }
  .panel { border:1px solid var(--line); background:white; border-radius:16px; padding:20px; box-shadow:0 4px 13px #21375a04; min-width:0; }
  .job-list { display:grid; gap:11px; }
  .job-card { display:flex; align-items:flex-start; gap:13px; border:1px solid #e9edf5; border-radius:13px; padding:14px; transition:.18s; }
  .job-card:hover { border-color:#ced8f5; box-shadow:0 4px 14px #2d4a8009; }
  .company-logo { display:grid; place-items:center; flex-shrink:0; width:43px; height:43px; border-radius:12px; background:#e7efff; color:#3655b9; font-size:14px; font-weight:850; }
  .company-logo.green { background:#e4f7ee; color:#19805e; }
  .company-logo.orange { background:#fff0df; color:#a96921; }
  .company-logo.purple { background:#f0e9ff; color:#7954bd; }
  .job-main { flex:1; min-width:0; }
  .job-title { font-size:13px; font-weight:800; margin:2px 0 5px; color:#263650; }
  .job-company { font-size:11px; color:#7b879b; margin-bottom:10px; }
  .job-meta { display:flex; flex-wrap:wrap; gap:7px 12px; color:#7c8799; font-size:10px; }
  .job-actions { display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
  .badge { display:inline-flex; align-items:center; gap:5px; border-radius:6px; background:#edf7f2; color:#23815f; padding:5px 7px; font-size:9px; font-weight:800; white-space:nowrap; }
  .badge.blue { color:#4263db; background:#eef1ff; }
  .badge.gold { color:#a76e14; background:#fff4de; }
  .badge.gray { color:#69778e; background:#f0f2f6; }
  .side-stack { display:grid; gap:15px; }
  .checklist { display:grid; gap:14px; margin-top:16px; }
  .check-item { display:flex; align-items:flex-start; gap:10px; }
  .check-dot { display:grid; place-items:center; width:23px; height:23px; flex-shrink:0; border-radius:50%; background:#e5f8ef; color:#16845e; font-size:12px; font-weight:900; }
  .check-dot.pending { color:#a1aaba; background:#f0f2f6; }
  .check-item strong { display:block; font-size:11px; margin:1px 0 4px; }
  .check-item small { display:block; color:var(--muted); font-size:10px; line-height:1.5; }
  .tip-card { background:#f1f5ff; border:1px solid #e3eaff; border-radius:14px; padding:16px; }
  .tip-card strong { font-size:12px; display:block; margin:8px 0 5px; }
  .tip-card p { color:#687898; margin:0 0 12px; line-height:1.6; font-size:11px; }
  .page-toolbar { display:flex; justify-content:space-between; align-items:center; gap:14px; margin:22px 0 18px; flex-wrap:wrap; }
  .searchbar { display:flex; align-items:center; gap:9px; border:1px solid var(--line); background:white; border-radius:10px; padding:0 12px; min-width:230px; height:42px; flex:1; max-width:440px; }
  .searchbar span { color:#8894a7; font-size:17px; }
  .searchbar input { border:0; outline:none; width:100%; min-width:0; color:var(--ink); font-size:12px; background:transparent; }
  .filters { display:flex; gap:9px; align-items:center; flex-wrap:wrap; }
  .select { height:40px; border:1px solid var(--line); background:white; color:#66758c; border-radius:9px; padding:0 11px; font-size:11px; }
  .field { display:grid; gap:7px; }
  .field label { color:#5b6981; font-size:11px; font-weight:750; }
  .field input,.field select,.field textarea { border:1px solid #dfe5ef; border-radius:9px; width:100%; color:#27364e; background:#fff; padding:11px 12px; font-size:12px; min-width:0; }
  .field textarea { resize:vertical; min-height:86px; line-height:1.55; }
  .field input::placeholder,.field textarea::placeholder { color:#a4adbb; }
  .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
  .form-grid .full { grid-column:1 / -1; }
  .profile-grid { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(260px,.7fr); gap:20px; align-items:start; }
  .profile-cover { height:95px; border-radius:14px 14px 0 0; background:linear-gradient(115deg,#dce7ff,#e4f8ef); position:relative; }
  .profile-header { padding:0 22px 18px; border-bottom:1px solid var(--line); }
  .profile-avatar { width:66px; height:66px; display:grid; place-items:center; font-size:22px; font-weight:850; background:#fff; color:#3455bd; border:4px solid white; border-radius:50%; box-shadow:0 3px 9px #18346314; margin-top:-33px; position:relative; }
  .profile-title-row { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; margin-top:6px; }
  .profile-title-row h3 { margin:0 0 5px; font-size:18px; letter-spacing:-.5px; }
  .profile-title-row p { margin:0; color:var(--muted); font-size:11px; }
  .profile-section { padding:20px 22px; border-bottom:1px solid var(--line); }
  .profile-section:last-child { border-bottom:0; }
  .profile-section h4 { margin:0 0 15px; font-size:13px; }
  .skill-list { display:flex; flex-wrap:wrap; gap:7px; }
  .skill { padding:7px 9px; background:#f2f5fb; border:1px solid #e8edf5; border-radius:7px; color:#617089; font-size:10px; font-weight:700; }
  .project-row { display:flex; gap:11px; padding:12px 0; border-bottom:1px solid #edf0f5; }
  .project-row:last-child { border-bottom:0; }
  .project-symbol { width:35px; height:35px; flex-shrink:0; display:grid; place-items:center; color:var(--blue); background:#edf1ff; border-radius:9px; }
  .project-row strong { font-size:11px; display:block; margin:1px 0 4px; }
  .project-row p { margin:0; color:var(--muted); font-size:10px; line-height:1.55; }
  .privacy-row { display:flex; justify-content:space-between; align-items:center; gap:14px; border:1px solid #e3f3eb; background:#f5fcf8; padding:14px; border-radius:12px; }
  .privacy-row strong { display:block; font-size:11px; margin-bottom:4px; }
  .privacy-row small { color:var(--muted); font-size:10px; line-height:1.5; display:block; max-width:320px; }
  .toggle { position:relative; flex-shrink:0; width:39px; height:22px; border:0; border-radius:20px; background:#cbd3df; padding:0; transition:.18s; }
  .toggle:after { content:""; position:absolute; left:3px; top:3px; width:16px; height:16px; background:white; border-radius:50%; box-shadow:0 1px 3px #17223833; transition:.18s; }
  .toggle.on { background:#1b9b70; }
  .toggle.on:after { left:20px; }
  .candidate-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:15px; }
  .candidate-card { background:white; border:1px solid var(--line); border-radius:15px; padding:18px; box-shadow:0 4px 13px #21375a04; }
  .candidate-top { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .candidate-person { display:flex; align-items:center; gap:10px; min-width:0; }
  .candidate-person h4 { margin:0 0 4px; font-size:12px; }
  .candidate-person p { margin:0; color:var(--muted); font-size:10px; line-height:1.4; }
  .candidate-about { color:#7b8799; font-size:10px; line-height:1.65; margin:15px 0 12px; min-height:50px; }
  .candidate-stats { display:flex; gap:15px; padding:11px 0; border-top:1px solid #edf0f5; border-bottom:1px solid #edf0f5; }
  .candidate-stats strong { display:block; font-size:12px; margin-bottom:3px; }
  .candidate-stats small { color:var(--muted); font-size:9px; }
  .candidate-card .skill-list { margin:13px 0 16px; }
  .candidate-card .skill { font-size:9px; padding:6px 7px; }
  .candidate-actions { display:flex; gap:8px; }
  .candidate-actions .btn { flex:1; padding:9px 8px; font-size:10px; }
  .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:13px; background:#fff; }
  table { border-collapse:collapse; width:100%; min-width:650px; }
  th { text-align:left; background:#f8f9fc; font-size:10px; letter-spacing:.2px; text-transform:uppercase; color:#8290a4; padding:14px 16px; border-bottom:1px solid var(--line); }
  td { padding:15px 16px; font-size:11px; color:#53627a; border-bottom:1px solid #edf0f5; }
  tr:last-child td { border-bottom:0; }
  .table-person { display:flex; align-items:center; gap:9px; color:#24344d; font-weight:800; }
  .table-person .avatar { width:32px; height:32px; font-size:10px; }
  .empty { padding:36px 20px; text-align:center; color:var(--muted); }
  .empty .empty-icon { font-size:30px; margin-bottom:10px; }
  .empty h3 { color:var(--ink); margin:0 0 7px; font-size:14px; }
  .empty p { margin:0 auto 14px; font-size:11px; line-height:1.6; max-width:330px; }
  .vacancy-list { display:grid; gap:12px; }
  .vacancy-manage { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:16px; align-items:center; border:1px solid var(--line); padding:17px; background:#fff; border-radius:13px; }
  .vacancy-manage h4 { margin:0 0 6px; font-size:13px; }
  .vacancy-manage p { margin:0; color:var(--muted); font-size:10px; }
  .vacancy-manage-meta { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .modal-backdrop { position:fixed; inset:0; background:#101c31a6; backdrop-filter:blur(4px); z-index:20; display:grid; place-items:center; padding:20px; }
  .modal { background:white; width:min(590px,100%); max-height:90vh; overflow:auto; border-radius:18px; box-shadow:0 25px 80px #09152a40; }
  .modal-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; padding:22px 24px 18px; border-bottom:1px solid var(--line); }
  .modal-head h3 { margin:0; font-size:17px; letter-spacing:-.4px; }
  .modal-head p { margin:6px 0 0; color:var(--muted); font-size:11px; line-height:1.5; }
  .modal-close { width:31px; height:31px; border-radius:9px; border:1px solid var(--line); color:#6d7a8e; background:white; font-size:18px; }
  .modal-body { padding:21px 24px 24px; }
  .modal-actions { display:flex; justify-content:flex-end; gap:9px; padding-top:20px; }
  .detail-block { margin-bottom:18px; }
  .detail-block h4 { font-size:11px; color:#43516b; margin:0 0 8px; }
  .detail-block p { color:#6f7d91; font-size:11px; line-height:1.7; margin:0; }
  .toast { position:fixed; bottom:22px; right:24px; z-index:30; background:#14243c; color:white; padding:13px 17px; border-radius:11px; box-shadow:0 10px 30px #101d3240; font-size:12px; font-weight:700; display:none; max-width:min(360px,calc(100vw - 40px)); }
  .toast.show { display:block; animation:pop .2s ease-out; }
  @keyframes pop { from { opacity:0; transform:translateY(7px); } to { opacity:1; transform:translateY(0); } }
  .footnote { color:#99a3b3; font-size:10px; line-height:1.55; margin-top:20px; }
  .mobile-menu { display:none; }
  @media (max-width:1150px) { .content { padding:25px 24px 38px; } .topbar { padding:0 24px; } .candidate-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .stats-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media (max-width:860px) { .layout { grid-template-columns:1fr; } .sidebar { min-height:auto; padding:13px 16px; flex-direction:row; align-items:center; justify-content:space-between; gap:16px; } .brand { padding:0; } .brand-sub,.nav-label,.sidebar-bottom,.sidebar .nav { display:none; } .mobile-menu { display:flex; gap:4px; overflow:auto; } .mobile-menu .nav-btn { width:auto; white-space:nowrap; padding:9px 10px; font-size:11px; } .mobile-menu .nav-icon { display:none; } .topbar { height:auto; min-height:75px; } .dashboard-grid,.profile-grid { grid-template-columns:1fr; } .hero { grid-template-columns:1fr; } .hero-progress { justify-self:start; max-width:100%; } .hero-progress .progress-track { max-width:400px; } }

function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function initials(name=''){ return name.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase(); }
function avatar(name,color='blue',size=''){ return `<div class="avatar ${color==='green'?'green':color==='orange'?'orange':''}" ${size?`style="width:${size};height:${size};"`:''}>${esc(initials(name))}</div>`; }
function logo(initials,color='blue'){ return `<div class="company-logo ${color==='green'?'green':color==='orange'?'orange':color==='purple'?'purple':''}">${esc(initials)}</div>`; }
function badge(text,type=''){return `<span class="badge ${type}">${esc(text)}</span>`;}
function btn(text,action,cls='btn-secondary',extra=''){return `<button type="button" class="btn ${cls}" data-action="${esc(action)}" ${extra}>${text}</button>`;}
function pageHeading(){return titles[state.page]||'Visão geral';}
function sidebarNav(){const items=state.role==='student'?navStudent:navCompany;return items.map(([id,ico,label])=>`<button class="nav-btn ${state.page===id?'active':''}" data-page="${id}" type="button"><span class="nav-icon">${ico}</span>${label}</button>`).join('');}
function render(){
 const isStudent=state.role==='student'; const profileName=isStudent?state.profile.name:'Nexa Tecnologia';
 document.getElementById('app').innerHTML=`<div class="layout">
 <aside class="sidebar"><div class="brand"><div class="brand-mark">C</div><div><div class="brand-name">campus <span>link</span></div><div class="brand-sub">Talentos em conexão</div></div></div>
 <div style="width:100%"><div class="nav-label">MENU PRINCIPAL</div><nav class="nav">${sidebarNav()}</nav><nav class="mobile-menu">${sidebarNav()}</nav></div>
 <div class="sidebar-bottom"><div class="help-box"><strong>Precisa de ajuda?</strong><p>Veja como destacar seu perfil e aproveitar melhor a plataforma.</p><button data-action="help" type="button">Acessar central de ajuda ↗</button></div><div class="user-mini">${avatar(profileName,isStudent?'blue':'green')}<div><strong>${esc(profileName)}</strong><small>${isStudent?'Perfil de estudante':'Perfil de empresa'}</small></div></div></div>

 <div class="main"><header class="topbar"><div><div class="crumb">Campus Link / ${esc(pageHeading())}</div><h1 class="page-heading">${esc(pageHeading())}</h1></div><div class="topbar-right"><div class="role-switch" aria-label="Alternar perfil"><button class="${isStudent?'active':''}" type="button" data-role="student">Estudante</button><button class="${!isStudent?'active':''}" type="button" data-role="company">Empresa</button></div><button class="notification" aria-label="Notificações" type="button" data-action="notifications">♧</button></div></header><main class="content">${renderPage()}</main></div></div>`;
}

 }

 if(state.page==='applications') return renderCompanyApplications();

}

 <div class="dashboard-grid"><section><div class="section-head"><h3>Oportunidades em destaque</h3><button class="text-link" data-page="jobs">Ver todas →</button></div><div class="panel"><div class="job-list">${state.vacancies.slice(0,3).map(jobCard).join('')}</div></div></section><div class="side-stack"><section class="panel"><div class="section-head"><h3>Deixe seu perfil mais forte</h3>${badge('Dica','blue')}</div><div class="checklist"><div class="check-item"><span class="check-dot">✓</span><div><strong>Adicione projetos práticos</strong><small>Mostre o que você sabe fazer além da sala de aula.</small></div></div><div class="check-item"><span class="check-dot">✓</span><div><strong>Mantenha suas competências atualizadas</strong><small>Inclua ferramentas e conhecimentos relevantes para sua área.</small></div></div><div class="check-item"><span class="check-dot pending">＋</span><div><strong>Revise sua disponibilidade</strong><small>Ajude as empresas a entenderem seus horários.</small></div></div></div><div style="margin-top:17px">${btn('Editar perfil','goto-profile','btn-soft','style="width:100%"')}</div></section><div class="tip-card"><div style="font-size:20px">✦</div><strong>Seu potencial vai além das notas</strong><p>Projetos, cursos, publicações e experiências acadêmicas também ajudam a contar sua história.</p><button class="text-link" data-action="tip-profile">Ver dicas de perfil →</button></div></div></div>
 <p class="footnote">Protótipo acadêmico: dados, empresas e oportunidades apresentados nesta tela são exemplos demonstrativos.</p>`;

function jobCard(j){const applied=state.applications.some(a=>a.vacancyId===j.id);return `<article class="job-card">${logo(j.initials,j.color)}<div class="job-main"><div class="job-title">${esc(j.title)}</div><div class="job-company">${esc(j.company)}</div><div class="job-meta"><span>⌖ ${esc(j.location)}</span><span>◷ ${esc(j.workload||'20h semanais')}</span><span>◉ ${esc(j.modality)}</span></div></div><div class="job-actions">${badge(j.area,'blue')}<button type="button" class="btn ${applied?'btn-success':'btn-secondary'} btn-small" data-apply="${j.id}" ${applied?'disabled':''}>${applied?'Candidatado':'Tenho interesse'}</button></div></article>`;}

 <aside class="side-stack"><section class="panel"><div class="section-head"><h3>Visibilidade do perfil</h3><span>◉</span></div><div class="privacy-row"><div><strong>${state.showProfile?'Perfil visível':'Perfil oculto'}</strong><small>${state.showProfile?'Empresas podem encontrar seu perfil nesta demonstração.':'Seu perfil não aparece na busca de talentos.'}</small></div><button type="button" class="toggle ${state.showProfile?'on':''}" aria-label="Alternar visibilidade" data-action="toggle-profile"></button></div><p class="footnote">A visibilidade representa uma opção de privacidade no protótipo. O controle real de acesso deverá ser implementado no sistema.</p></section><section class="panel"><h3 style="font-size:14px;margin:0 0 14px">Competências em destaque</h3><p class="subtext" style="font-size:11px;margin:0 0 14px">Empresas podem usar habilidades e área de formação para encontrar perfis compatíveis.</p><div class="skill-list">${p.skills.slice(0,5).map(s=>`<span class="skill">${esc(s)}</span>`).join('')}</div><div style="margin-top:16px">${btn('Explorar oportunidades','goto-jobs','btn-soft','style="width:100%"')}</div></section><section class="tip-card"><div style="font-size:20px">⌁</div><strong>Uma dica para você</strong><p>Descreva o resultado dos seus projetos, as ferramentas usadas e o que você aprendeu.</p></section></aside></div>`;}
function renderJobs(){const q=state.query.toLowerCase();const jobs=state.vacancies.filter(j=>(`${j.title} ${j.company} ${j.area} ${j.skills.join(' ')}`).toLowerCase().includes(q)&&(state.typeFilter==='Todas as modalidades'||j.modality===state.typeFilter));return `<div class="welcome-row"><div><div class="eyebrow">ENCONTRE SEU PRÓXIMO PASSO</div><h2>Oportunidades de estágio</h2><p class="subtext">Explore vagas e demonstre interesse nas que combinam com seu perfil.</p></div><span>${badge(`${jobs.length} oportunidades`,'blue')}</span></div><div class="page-toolbar"><form id="job-search-form" class="searchbar"><span>⌕</span><input id="job-search" name="query" value="${esc(state.query)}" placeholder="Cargo, empresa ou competência..." aria-label="Pesquisar oportunidades"><button class="text-link" type="submit">Buscar</button></form><div class="filters"><select id="job-type-filter" class="select" aria-label="Modalidade"><option>Todas as modalidades</option>${['Remoto','Híbrido','Presencial'].map(x=>`<option ${state.typeFilter===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="job-list">${jobs.length?jobs.map(j=>`<article class="panel" style="padding:19px">${jobCard(j)}<div style="margin:13px 0 0 56px;color:#6f7d91;font-size:11px;line-height:1.65">${esc(j.description)}<div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:10px">${j.skills.map(s=>`<span class="skill">${esc(s)}</span>`).join('')}</div><div style="margin-top:12px;display:flex;gap:7px;flex-wrap:wrap">${badge(j.salary,'gray')}${badge(j.deadline,'gold')}</div></div></article>`).join(''):`<div class="panel empty"><div class="empty-icon">⌕</div><h3>Nenhuma oportunidade encontrada</h3><p>Tente mudar os termos da busca ou selecionar outra modalidade.</p><button class="btn btn-secondary" data-action="clear-job-filters">Limpar filtros</button></div>`}</div><p class="footnote">Vagas fictícias criadas apenas para demonstrar a navegação do protótipo; não representam oportunidades reais.</p>`;}
function renderApplications(){return `<div class="welcome-row"><div><div class="eyebrow">ACOMPANHE SUAS INSCRIÇÕES</div><h2>Minhas candidaturas</h2><p class="subtext">Consulte o andamento das oportunidades em que você demonstrou interesse.</p></div>${badge(`${state.applications.length} candidatura(s)`,'blue')}</div>${state.applications.length?`<div class="table-wrap"><table><thead><tr><th>Oportunidade</th><th>Empresa</th><th>Data</th><th>Status</th><th>Feedback</th></tr></thead><tbody>${state.applications.map(a=>`<tr><td><strong style="color:#263650">${esc(a.title)}</strong></td><td>${esc(a.company)}</td><td>${esc(a.date)}</td><td>${badge(a.status,a.status==='Aprovado'?'':a.status==='Não selecionado'?'gray':'blue')}</td><td>${a.feedback?`<button class="text-link" data-feedback="${a.id}">Ver feedback</button>`:'—'}</td></tr>`).join('')}</tbody></table></div>`:`<div class="panel empty"><div class="empty-icon">↗</div><h3>Você ainda não tem candidaturas</h3><p>Explore as oportunidades disponíveis e demonstre interesse naquelas que combinam com seu perfil.</p><button class="btn btn-primary" data-action="goto-jobs">Explorar oportunidades</button></div>`}<p class="footnote">O acompanhamento e o feedback são apresentados como fluxo demonstrativo. A troca real de informações dependerá das empresas participantes.</p>`;}
function renderCompanyDashboard(){return `<div class="welcome-row"><div><div class="eyebrow">PAINEL DA EMPRESA</div><h2>Bem-vinda ao Campus Link</h2><p class="subtext">Encontre estudantes com potencial e aproxime seu processo de recrutamento da universidade.</p></div>${btn('＋ Publicar vaga','goto-vacancies','btn-primary')}</div><section class="hero"><div class="hero-copy"><div class="hero-tag">✦ CONEXÕES MAIS DIRETAS</div><h2>Encontre talentos além do currículo tradicional.</h2><p>Consulte perfis acadêmicos, projetos e competências para identificar estudantes alinhados às suas oportunidades.</p>${btn('Buscar estudantes','goto-talent','btn-primary')}</div><div class="hero-progress"><div class="label">Seu espaço de recrutamento</div><div class="progress-num">${state.companyJobs.length}<span style="font-size:14px;font-weight:600"> vagas</span></div><div class="progress-foot">Gerencie suas oportunidades e acompanhe as candidaturas recebidas.</div></div></section><div class="stats-grid"><div class="stat-card"><div class="stat-top"><div class="stat-icon">◎</div>${badge('Perfis','blue')}</div><div class="stat-value">${state.candidates.filter(c=>state.showProfile||c.name!=='Ana Beatriz Lima').length}</div><div class="stat-label">Perfis demonstrativos disponíveis</div></div><div class="stat-card"><div class="stat-top"><div class="stat-icon green">▤</div></div><div class="stat-value">${state.companyJobs.length}</div><div class="stat-label">Vagas cadastradas</div></div><div class="stat-card"><div class="stat-top"><div class="stat-icon gold">↗</div></div><div class="stat-value">${state.received.length}</div><div class="stat-label">Candidaturas recebidas</div></div><div class="stat-card"><div class="stat-top"><div class="stat-icon pink">◷</div></div><div class="stat-value">${state.received.filter(a=>a.status==='Nova candidatura').length}</div><div class="stat-label">Aguardando análise</div></div></div><div class="dashboard-grid"><section><div class="section-head"><h3>Estudantes em destaque</h3><button class="text-link" data-page="talent">Ver talentos →</button></div><div class="panel"><div class="candidate-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">${state.candidates.slice(0,2).map(candidateMini).join('')}</div></div></section><div class="side-stack"><section class="panel"><div class="section-head"><h3>Próximos passos</h3>${badge('Sugestão','blue')}</div><div class="checklist"><div class="check-item"><span class="check-dot">✓</span><div><strong>Descreva bem a vaga</strong><small>Inclua atividades, modalidade e competências desejadas.</small></div></div><div class="check-item"><span class="check-dot pending">＋</span><div><strong>Consulte os perfis</strong><small>Compare projetos, cursos e habilidades relevantes.</small></div></div><div class="check-item"><span class="check-dot pending">＋</span><div><strong>Retorne aos candidatos</strong><small>Registre o andamento e compartilhe feedback.</small></div></div></div><div style="margin-top:16px">${btn('Gerenciar vagas','goto-vacancies','btn-soft','style="width:100%"')}</div></section><div class="tip-card"><div style="font-size:20px">✦</div><strong>Seleção com mais contexto</strong><p>Projetos acadêmicos e atividades práticas também podem revelar competências relevantes.</p></div></div></div><p class="footnote">Empresa, vagas, estudantes e candidaturas exibidos são dados fictícios para a demonstração do protótipo.</p>`;}
function candidateMini(c){return `<article class="candidate-card">${candidateTop(c)}<p class="candidate-about">${esc(c.summary)}</p><div class="skill-list">${c.skills.slice(0,3).map(s=>`<span class="skill">${esc(s)}</span>`).join('')}</div><div class="candidate-actions"><button class="btn btn-secondary" data-candidate="${c.id}">Ver perfil</button><button class="btn btn-soft" data-contact="${c.id}">Contato</button></div></article>`;}
function candidateTop(c){return `<div class="candidate-top"><div class="candidate-person">${avatar(c.name,c.color)}<div><h4>${esc(c.name)}</h4><p>${esc(c.course)}<br>${esc(c.period)}</p></div></div>${badge('Estudante','blue')}</div>`;}
function renderTalent(){let list=state.candidates.filter(c=>(state.showProfile||c.name!=='Ana Beatriz Lima')&&(`${c.name} ${c.course} ${c.skills.join(' ')}`).toLowerCase().includes(state.query.toLowerCase())&&(state.courseFilter==='Todos os cursos'||c.course===state.courseFilter));return `<div class="welcome-row"><div><div class="eyebrow">BANCO DE TALENTOS</div><h2>Encontre seu próximo talento</h2><p class="subtext">Pesquise estudantes por formação, competências e projetos acadêmicos.</p></div>${badge(`${list.length} perfis`,'blue')}</div><div class="page-toolbar"><form id="talent-search-form" class="searchbar"><span>⌕</span><input name="query" value="${esc(state.query)}" placeholder="Nome, curso ou competência..." aria-label="Buscar estudantes"><button class="text-link" type="submit">Buscar</button></form><div class="filters"><select id="course-filter" class="select" aria-label="Filtrar curso"><option>Todos os cursos</option>${[...new Set(state.candidates.map(c=>c.course))].map(x=>`<option ${state.courseFilter===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div><div class="candidate-grid">${list.length?list.map(candidateCard).join(''):`<div class="panel empty" style="grid-column:1/-1"><div class="empty-icon">◎</div><h3>Nenhum perfil encontrado</h3><p>Experimente buscar por outra competência ou curso.</p><button class="btn btn-secondary" data-action="clear-talent-filters">Limpar filtros</button></div>`}</div><p class="footnote">Os perfis são fictícios. A visualização e o contato reais devem respeitar as permissões de acesso e a privacidade dos estudantes.</p>`;}
function candidateCard(c){return `<article class="candidate-card">${candidateTop(c)}<p class="candidate-about">${esc(c.summary)}</p><div class="candidate-stats"><div><strong>${c.projects}</strong><small>Projetos / atividades</small></div><div><strong>${c.skills.length}</strong><small>Competências</small></div></div><div class="skill-list">${c.skills.slice(0,4).map(s=>`<span class="skill">${esc(s)}</span>`).join('')}</div><div class="candidate-actions"><button class="btn btn-secondary" data-candidate="${c.id}">Ver perfil</button><button class="btn btn-soft" data-contact="${c.id}">Entrar em contato</button></div></article>`;}
function renderCompanyVacancies(){return `<div class="welcome-row"><div><div class="eyebrow">OPORTUNIDADES DA EMPRESA</div><h2>Gerenciar vagas</h2><p class="subtext">Cadastre oportunidades e organize as informações que os estudantes verão.</p></div><button class="btn btn-primary" data-action="add-vacancy">＋ Cadastrar vaga</button></div><div class="stats-grid" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="stat-card"><div class="stat-top"><div class="stat-icon green">▤</div></div><div class="stat-value">${state.companyJobs.length}</div><div class="stat-label">Vagas cadastradas</div></div><div class="stat-card"><div class="stat-top"><div class="stat-icon">◉</div></div><div class="stat-value">${state.received.length}</div><div class="stat-label">Candidaturas recebidas</div></div><div class="stat-card"><div class="stat-top"><div class="stat-icon gold">◷</div></div><div class="stat-value">${state.received.filter(x=>x.status==='Nova candidatura').length}</div><div class="stat-label">Novas candidaturas</div></div></div><div class="section-head"><h3>Suas oportunidades</h3>${badge('Visão demonstrativa','gray')}</div><div class="vacancy-list">${state.companyJobs.map(j=>`<article class="vacancy-manage"><div><h4>${esc(j.title)}</h4><p>${esc(j.area)} · ${esc(j.modality)} · ${esc(j.workload)}</p><div class="vacancy-manage-meta">${badge('Publicada','')}${badge(j.salary,'gray')}${badge(`Prazo: ${j.deadline}`,'gold')}</div></div><button type="button" class="btn btn-secondary btn-small" data-company-job="${j.id}">Ver detalhes</button></article>`).join('')}</div><p class="footnote">O cadastro é simulado localmente. A publicação real exigiria persistência dos dados e autenticação da empresa.</p>`;}
function renderCompanyApplications(){return `<div class="welcome-row"><div><div class="eyebrow">PROCESSO SELETIVO</div><h2>Candidaturas recebidas</h2><p class="subtext">Consulte os estudantes interessados e registre o andamento do processo seletivo.</p></div>${badge(`${state.received.length} candidaturas`,'blue')}</div><div class="table-wrap"><table><thead><tr><th>Candidato</th><th>Vaga</th><th>Data</th><th>Status</th><th>Ações</th></tr></thead><tbody>${state.received.map(a=>`<tr><td><div class="table-person">${avatar(a.name,a.color)}<span>${esc(a.name)}<small style="display:block;font-weight:500;color:#8994a7;margin-top:3px">${esc(a.course)}</small></span></div></td><td>${esc(a.vacancy)}</td><td>${esc(a.date)}</td><td>${badge(a.status,a.status==='Nova candidatura'?'blue':a.status==='Feedback enviado'?'':'gray')}</td><td><div style="display:flex;gap:5px;flex-wrap:wrap"><button class="btn btn-secondary btn-small" data-received-candidate="${a.id}">Ver perfil</button><button class="btn btn-soft btn-small" data-feedback-company="${a.id}">Feedback</button></div></td></tr>`).join('')}</tbody></table></div><p class="footnote">Atualizar status e feedback altera apenas os dados locais desta demonstração.</p>`;}
function openModal(title,subtitle,body){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" data-action="backdrop-close"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header class="modal-head"><div><h3>${esc(title)}</h3><p>${esc(subtitle||'')}</p></div><button class="modal-close" type="button" data-action="close-modal" aria-label="Fechar">×</button></header><div class="modal-body">${body}</div></section></div>`;}
function closeModal(){document.getElementById('modal-root').innerHTML='';}
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>el.classList.remove('show'),3000);}
function navigate(page){state.page=page;state.query='';render();window.scrollTo({top:0,behavior:'smooth'});}
function addInterest(id){const j=state.vacancies.find(x=>x.id===Number(id));if(!j)return;if(state.applications.some(a=>a.vacancyId===j.id)){showToast('Você já demonstrou interesse nesta oportunidade.');return;}state.applications.unshift({id:Date.now(),vacancyId:j.id,title:j.title,company:j.company,date:'26 out, 2026',status:'Enviada',feedback:''});render();showToast('Interesse registrado no protótipo.');}
function showCandidate(id){const c=state.candidates.find(x=>x.id===Number(id));if(!c)return;openModal(c.name,`${c.course} · ${c.period}`,`<div style="display:flex;gap:13px;align-items:center;margin-bottom:19px">${avatar(c.name,c.color,'54px')}<div><strong style="font-size:13px">Perfil acadêmico e profissional</strong><p style="margin:5px 0 0;color:#7b8799;font-size:11px">Disponibilidade: ${esc(c.availability)}</p></div></div><div class="detail-block"><h4>Sobre</h4><p>${esc(c.summary)}</p></div><div class="detail-block"><h4>Competências</h4><div class="skill-list">${c.skills.map(s=>`<span class="skill">${esc(s)}</span>`).join('')}</div></div><div class="detail-block"><h4>Projetos e atividades</h4><p>${c.projects} projetos ou atividades registrados no perfil demonstrativo.</p></div><div class="detail-block"><h4>Contato</h4><p>O endereço de contato está oculto nesta visualização resumida. Use “Entrar em contato” para simular uma solicitação de contato profissional.</p></div><div class="modal-actions"><button class="btn btn-secondary" data-action="close-modal">Fechar</button><button class="btn btn-primary" data-contact="${c.id}">Entrar em contato</button></div>`);}
function showCompanyJob(id){const j=state.companyJobs.find(x=>x.id===Number(id));if(!j)return;openModal(j.title,'Detalhes da vaga cadastrada',`<div class="detail-block"><h4>Área e modalidade</h4><p>${esc(j.area)} · ${esc(j.modality)} · ${esc(j.workload)}</p></div><div class="detail-block"><h4>Descrição</h4><p>${esc(j.description)}</p></div><div class="detail-block"><h4>Bolsa / remuneração</h4><p>${esc(j.salary)}</p></div><div class="detail-block"><h4>Prazo de inscrição</h4><p>${esc(j.deadline)}</p></div><div class="modal-actions"><button class="btn btn-secondary" data-action="close-modal">Fechar</button><button class="btn btn-primary" data-action="goto-talent">Buscar estudantes</button></div>`);}
function showFeedback(id){const a=state.applications.find(x=>x.id===Number(id));if(!a)return;openModal('Feedback da candidatura',a.title,`<div class="detail-block"><h4>Empresa</h4><p>${esc(a.company)}</p></div><div class="detail-block"><h4>Retorno</h4><p>${esc(a.feedback||'Ainda não há feedback registrado para esta candidatura.')}</p></div><div class="modal-actions"><button class="btn btn-primary" data-action="close-modal">Entendi</button></div>`);}
function openAddProject(){openModal('Adicionar projeto ou experiência','Destaque atividades práticas, projetos acadêmicos e experiências relevantes.',`<form id="modal-form" data-modal-type="project"><div class="form-grid"><div class="field full"><label for="project-name">Nome</label><input id="project-name" name="name" required placeholder="Ex.: Aplicação de controle financeiro"></div><div class="field"><label for="project-type">Tipo</label><select name="type" id="project-type"><option>Projeto acadêmico</option><option>Projeto pessoal</option><option>Experiência profissional</option><option>Pesquisa / extensão</option><option>Voluntariado</option></select></div><div class="field full"><label for="project-description">O que você fez?</label><textarea id="project-description" name="description" required placeholder="Descreva a atividade, as ferramentas usadas ou o que aprendeu."></textarea></div></div><div class="modal-actions"><button type="button" class="btn btn-secondary" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">Adicionar ao perfil</button></div></form>`);}
function openAddCourse(){openModal('Adicionar curso ou capacitação','Registre conhecimentos desenvolvidos dentro ou fora da universidade.',`<form id="modal-form" data-modal-type="course"><div class="form-grid"><div class="field full"><label for="course-name">Nome do curso</label><input id="course-name" name="name" required placeholder="Ex.: Introdução à análise de dados"></div><div class="field"><label for="course-org">Instituição / plataforma</label><input id="course-org" name="org" required placeholder="Onde realizou"></div><div class="field"><label for="course-detail">Carga horária / ano</label><input id="course-detail" name="detail" placeholder="Ex.: 20 horas · 2026"></div></div><div class="modal-actions"><button type="button" class="btn btn-secondary" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">Adicionar curso</button></div></form>`);}
function openAddVacancy(){openModal('Cadastrar nova vaga','Preencha os dados principais para apresentar a oportunidade aos estudantes.',`<form id="modal-form" data-modal-type="vacancy"><div class="form-grid"><div class="field full"><label for="vacancy-title">Título da vaga</label><input id="vacancy-title" name="title" required placeholder="Ex.: Estágio em Desenvolvimento Web"></div><div class="field"><label for="vacancy-area">Área</label><select id="vacancy-area" name="area"><option>Tecnologia</option><option>Dados</option><option>Administração</option><option>Design</option><option>Saúde</option><option>Medicina Veterinária</option><option>Outra</option></select></div><div class="field"><label for="vacancy-modality">Modalidade</label><select id="vacancy-modality" name="modality"><option>Remoto</option><option>Híbrido</option><option>Presencial</option></select></div><div class="field"><label for="vacancy-workload">Carga horária</label><input name="workload" id="vacancy-workload" required placeholder="Ex.: 20h semanais"></div><div class="field"><label for="vacancy-salary">Bolsa / benefícios</label><input name="salary" id="vacancy-salary" placeholder="Ex.: R$ 1.000 + transporte"></div><div class="field"><label for="vacancy-deadline">Prazo (data)</label><input type="date" name="deadline" id="vacancy-deadline" required></div><div class="field full"><label for="vacancy-description">Descrição e requisitos</label><textarea id="vacancy-description" name="description" required placeholder="Responsabilidades, conhecimentos desejados e atividades de estágio."></textarea></div></div><div class="modal-actions"><button type="button" class="btn btn-secondary" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">Publicar vaga</button></div></form>`);}
function openFeedbackForm(id){const a=state.received.find(x=>x.id===Number(id));if(!a)return;openModal('Registrar retorno ao candidato',`${a.name} · ${a.vacancy}`,`<form id="modal-form" data-modal-type="feedback" data-record-id="${a.id}"><div class="field"><label for="feedback-status">Status da candidatura</label><select id="feedback-status" name="status"><option ${a.status==='Em análise'?'selected':''}>Em análise</option><option ${a.status==='Aprovado'?'selected':''}>Aprovado</option><option ${a.status==='Não selecionado'?'selected':''}>Não selecionado</option><option ${a.status==='Feedback enviado'?'selected':''}>Feedback enviado</option></select></div><div class="field" style="margin-top:14px"><label for="feedback-text">Feedback (opcional)</label><textarea id="feedback-text" name="feedback" placeholder="Compartilhe um retorno objetivo e respeitoso sobre o processo.">${esc(a.feedback)}</textarea></div><div class="modal-actions"><button type="button" class="btn btn-secondary" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">Salvar retorno</button></div></form>`);}
function helpModal(){openModal('Central de ajuda','Orientações rápidas para navegar pelo protótipo.',`<div class="detail-block"><h4>Sou estudante. Por onde começo?</h4><p>Complete seu perfil, registre projetos e cursos, consulte as vagas e demonstre interesse nas oportunidades compatíveis.</p></div><div class="detail-block"><h4>Sou empresa. Como encontro estudantes?</h4><p>Use a busca de talentos para filtrar perfis por curso e competências. Você também pode cadastrar vagas e simular o acompanhamento de candidaturas.</p></div><div class="detail-block"><h4>Os dados são reais?</h4><p>Não. Este é um protótipo acadêmico navegável. As informações são exemplos e as ações ficam restritas à demonstração no navegador.</p></div><div class="modal-actions"><button class="btn btn-primary" data-action="close-modal">Fechar</button></div>`);}

document.body.addEventListener('click',e=>{
 const role=e.target.closest('[data-role]');if(role){state.role=role.dataset.role;state.page='dashboard';state.query='';render();return;}
 const page=e.target.closest('[data-page]');if(page){navigate(page.dataset.page);return;}
 const ap=e.target.closest('[data-apply]');if(ap){addInterest(ap.dataset.apply);return;}
 const cand=e.target.closest('[data-candidate],[data-received-candidate]');if(cand){showCandidate(cand.dataset.candidate||state.candidates.find(x=>x.name===state.received.find(r=>r.id===Number(cand.dataset.receivedCandidate))?.name)?.id);return;}
 const contact=e.target.closest('[data-contact]');if(contact){const c=state.candidates.find(x=>x.id===Number(contact.dataset.contact));closeModal();showToast(`Solicitação de contato simulada para ${c?.name||'o estudante'}.`);return;}
 const job=e.target.closest('[data-company-job]');if(job){showCompanyJob(job.dataset.companyJob);return;}
 const fb=e.target.closest('[data-feedback]');if(fb){showFeedback(fb.dataset.feedback);return;}
 const fbc=e.target.closest('[data-feedback-company]');if(fbc){openFeedbackForm(fbc.dataset.feedbackCompany);return;}
 const act=e.target.closest('[data-action]');if(!act)return;const a=act.dataset.action;
 if(a==='goto-profile')navigate('profile');else if(a==='goto-jobs')navigate('jobs');else if(a==='goto-talent')navigate('talent');else if(a==='goto-vacancies')navigate('vacancies');else if(a==='add-project')openAddProject();else if(a==='add-course')openAddCourse();else if(a==='add-vacancy')openAddVacancy();else if(a==='toggle-profile'){state.showProfile=!state.showProfile;render();showToast(state.showProfile?'Seu perfil está visível na demonstração.':'Seu perfil foi ocultado na demonstração.');}else if(a==='clear-job-filters'){state.query='';state.typeFilter='Todas as modalidades';render();}else if(a==='clear-talent-filters'){state.query='';state.courseFilter='Todos os cursos';render();}else if(a==='tip-profile'){openModal('Como melhorar seu perfil','Algumas sugestões para tornar suas competências mais claras.',`<div class="checklist"><div class="check-item"><span class="check-dot">1</span><div><strong>Descreva resultados</strong><small>Explique o problema que seu projeto resolveu e sua contribuição.</small></div></div><div class="check-item"><span class="check-dot">2</span><div><strong>Inclua cursos e atividades práticas</strong><small>Mostre aprendizados que ainda não aparecem em experiências profissionais.</small></div></div><div class="check-item"><span class="check-dot">3</span><div><strong>Mantenha links atualizados</strong><small>Confira se LinkedIn, GitHub e portfólio abrem corretamente.</small></div></div></div><div class="modal-actions"><button class="btn btn-primary" data-action="close-modal">Entendi</button></div>`);}else if(a==='help')helpModal();else if(a==='notifications')showToast('Você está em uma demonstração: nenhuma notificação nova.');else if(a==='close-modal')closeModal();else if(a==='backdrop-close'&&e.target.classList.contains('modal-backdrop'))closeModal();
});
document.body.addEventListener('submit',e=>{
 if(e.target.id==='profile-form'){e.preventDefault();const fd=new FormData(e.target);for(const k of ['name','email','course','period','linkedin','github','availability','location','summary'])state.profile[k]=fd.get(k)||'';state.candidates[0].name=state.profile.name;state.candidates[0].initials=initials(state.profile.name);state.candidates[0].course=state.profile.course;state.candidates[0].period=state.profile.period;state.candidates[0].availability=state.profile.availability;state.candidates[0].summary=state.profile.summary;state.candidates[0].skills=[...state.profile.skills];render();showToast('Perfil atualizado neste protótipo.');return;}
 if(e.target.id==='job-search-form'){e.preventDefault();state.query=new FormData(e.target).get('query')||'';render();return;}
 if(e.target.id==='talent-search-form'){e.preventDefault();state.query=new FormData(e.target).get('query')||'';render();return;}
 if(e.target.id==='modal-form'){e.preventDefault();const form=e.target,fd=new FormData(form),type=form.dataset.modalType;
  if(type==='project'){state.profile.projects.push({name:fd.get('name'),type:fd.get('type'),description:fd.get('description')});}
  else if(type==='course'){state.profile.courses.push({name:fd.get('name'),org:fd.get('org'),detail:fd.get('detail')||'Capacitação complementar'});}
  else if(type==='vacancy'){const date=fd.get('deadline');const d=date?new Date(date+'T12:00:00').toLocaleDateString('pt-BR'):'A definir';state.companyJobs.unshift({id:Date.now(),title:fd.get('title'),area:fd.get('area'),modality:fd.get('modality'),workload:fd.get('workload'),salary:fd.get('salary')||'A combinar',deadline:d,description:fd.get('description')});}
  else if(type==='feedback'){const record=state.received.find(x=>x.id===Number(form.dataset.recordId));if(record){record.status=fd.get('status');record.feedback=fd.get('feedback')||'';if(record.feedback&&record.status==='Em análise')record.status='Feedback enviado';}}
  closeModal();render();showToast(type==='project'?'Projeto adicionado ao perfil.':type==='course'?'Curso adicionado ao perfil.':type==='vacancy'?'Vaga publicada na demonstração.':'Retorno atualizado na demonstração.');return;
 }
});
document.body.addEventListener('change',e=>{if(e.target.id==='job-type-filter'){state.typeFilter=e.target.value;render();}if(e.target.id==='course-filter'){state.courseFilter=e.target.value;render();}});
render();
</script>
